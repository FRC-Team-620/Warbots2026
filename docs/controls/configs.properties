# Each config = one ControlBoard implementation that gets its own diagram.
# <config>.controllers lists the CommandXboxController field names in the Java file.
# <config>.<field>.image = <type>/v<N> from controller-layouts/ (e.g. xbox/v1, gamesir-tarantula-2k/v1)
configs=single,dual

single.title=Unified Controller
single.source=src/main/java/org/jmhsrobotics/frc2026/controlBoard/SingleControl.java
single.controllers=driver
single.driver.port=0
single.driver.role=Driver + Operator
single.driver.image=xbox/v1

dual.title=Dual Controller
dual.source=src/main/java/org/jmhsrobotics/frc2026/controlBoard/DoubleControl.java
dual.controllers=driver,operator
dual.driver.port=0
dual.driver.role=Driver
dual.driver.image=xbox/v1
dual.operator.port=1
dual.operator.role=Operator
dual.operator.image=xbox/v1
