# Controller LAYOUT: a blank picture + where each input is. Button positions only -- never
# keybindings or robot functions (those live in the ControlBoard classes / functions.properties).
# Format reference: controller-layouts/xbox/v1/anchors.properties
#
# GameSir Tarantula 2K, used in XInput (Xbox) mode, so the Java uses CommandXboxController
# and the Xbox method names below. Front photo: triggers/bumpers are only the top corners.
# The four orange top-face macro buttons are not visible to the Driver Station and have no anchors.
name=GameSir Tarantula 2K (XInput / CommandXboxController)
image=controller.png
source=controller-sources/gamesir-tarantula-2k/gamesir-tarantula-2k-front.png
width=960
height=630
ignore=getHID,getLeftTriggerAxis,getRightTriggerAxis

input.getLeftX=leftStick,X axis
input.getLeftY=leftStick,Y axis
input.leftStick=leftStick,press
input.getRightX=rightStick,X axis
input.getRightY=rightStick,Y axis
input.rightStick=rightStick,press

anchor.leftTrigger=215,36,left,LT
anchor.leftBumper=245,46,left,LB
anchor.povUp=192,112,left,D-pad up
anchor.povLeft=135,165,left,D-pad left
anchor.povRight=250,165,left,D-pad right
anchor.povDown=192,220,left,D-pad down
anchor.back=452,157,left,- (Back)
anchor.leftStick=346,265,left,Left stick
anchor.rightTrigger=800,36,right,RT
anchor.rightBumper=770,46,right,RB
anchor.y=813,109,right,Y
anchor.start=559,157,right,+ (Start)
anchor.x=752,168,right,X
anchor.b=876,168,right,B
anchor.a=813,227,right,A
anchor.rightStick=669,265,right,Right stick
