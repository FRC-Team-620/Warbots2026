# Controller LAYOUT: a blank picture + where each input is. Button positions only -- never
# keybindings or robot functions (those live in the ControlBoard classes / functions.properties).
#
# anchor.<key>=x,y,side(left|right),display name
#   x,y are image pixels; side is which column the label goes in.
#   <key> is the controller method called in SingleControl/DoubleControl, with any argument
#   appended: a() -> a, leftBumper() -> leftBumper, button(3) -> button3, pov(90) -> pov90.
# input.<call>=<anchor key>,<detail>
#   Optional alias when several calls share one spot (stick axes + stick press).
# ignore=<calls that are not inputs>
name=Xbox controller (CommandXboxController)
image=controller.svg
source=controller-sources/xbox/xbox-drawing.svg
width=500
height=340
ignore=getHID,getLeftTriggerAxis,getRightTriggerAxis

input.getLeftX=leftStick,X axis
input.getLeftY=leftStick,Y axis
input.leftStick=leftStick,press
input.getRightX=rightStick,X axis
input.getRightY=rightStick,Y axis
input.rightStick=rightStick,press

anchor.leftTrigger=120,21,left,LT
anchor.leftBumper=100,50,left,LB
anchor.leftStick=112,140,left,Left stick
anchor.back=210,139,left,Back
anchor.povUp=195,186,left,D-pad up
anchor.povLeft=166,215,left,D-pad left
anchor.povRight=224,215,left,D-pad right
anchor.povDown=195,244,left,D-pad down
anchor.rightTrigger=380,21,right,RT
anchor.rightBumper=400,50,right,RB
anchor.y=384,102,right,Y
anchor.start=290,139,right,Start
anchor.b=416,138,right,B
anchor.x=340,152,right,X
anchor.a=384,174,right,A
anchor.rightStick=333,215,right,Right stick
