    <path fill="#efefef" d="M120 62 C 62 62, 32 112, 22 200 C 12 282, 34 332, 78 332 C 112 332, 132 292, 162 256 L 338 256 C 368 292, 388 332, 422 332 C 466 332, 488 282, 478 200 C 468 112, 438 62, 380 62 Z"/>
    <!-- guide button -->
    <circle cx="250" cy="100" r="18" fill="#d9d9d9"/>
    <!-- back / start -->
    <rect x="203" y="132" width="24" height="14" rx="7" fill="#c4c4c4"/>
    <rect x="273" y="132" width="24" height="14" rx="7" fill="#c4c4c4"/>
    <!-- left stick -->
    <circle cx="140" cy="140" r="36" fill="#d9d9d9"/>
    <circle cx="140" cy="140" r="24" fill="#bdbdbd"/>
    <!-- right stick -->
    <circle cx="305" cy="215" r="36" fill="#d9d9d9"/>
    <circle cx="305" cy="215" r="24" fill="#bdbdbd"/>
    <!-- d-pad -->
    <path fill="#c4c4c4" d="M183 180 h24 v23 h23 v24 h-23 v23 h-24 v-23 h-23 v-24 h23 Z"/>
  </g>
  <!-- face buttons -->
  <g stroke="#2b2b2b" stroke-width="3">
    <circle cx="372" cy="106" r="15" fill="#f2c94c"/>
    <circle cx="340" cy="138" r="15" fill="#5b8def"/>
    <circle cx="404" cy="138" r="15" fill="#e05a4f"/>
    <circle cx="372" cy="170" r="15" fill="#5cb85c"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">
    <text x="372" y="111">Y</text><text x="340" y="143">X</text>
    <text x="404" y="143">B</text><text x="372" y="175">A</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="12" fill="#2b2b2b" text-anchor="middle">
    <text x="145" y="26">LT</text><text x="355" y="26">RT</text>
    <text x="150" y="55">LB</text><text x="350" y="55">RB</text>
    <text x="140" y="144">L</text><text x="305" y="219">R</text>
  </g>
