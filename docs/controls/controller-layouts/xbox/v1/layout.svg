<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40.0" y="44.0" font-size="26" font-weight="700" fill="#111827" text-anchor="start">Xbox controller (CommandXboxController)</text>
<text x="40.0" y="70.0" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Controller layout xbox/v1  ·  button map only, no keybindings</text>
<text x="40.0" y="90.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start">Picture: controller-sources/xbox/xbox-drawing.svg</text>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" x="390" y="110" width="500" height="340">
  <g fill="none" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round">
